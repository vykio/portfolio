# Site statique, image nginx-unprivileged : écoute sur 8080 (non-root), racine en lecture seule.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression du texte ; les images (webp, jpg) et polices sont déjà compressées.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Sonde du cluster : liveness et readiness sur /.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Images et polices : cache long. Changer un fichier = changer son nom (ou accepter
    # jusqu'à 30 jours de cache chez les visiteurs qui l'ont déjà vu).
    location ~* \.(?:webp|jpe?g|png|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
