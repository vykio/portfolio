# Site statique, image nginx-unprivileged : écoute sur 8080 (non-root), racine en lecture seule.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression du texte ; les images (webp, jpg) et polices sont déjà compressées.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json application/ld+json image/svg+xml;

    # Un seul hôte indexable : www renvoie vers le domaine nu.
    if ($host = www.alexandre-vasseur.com) {
        return 301 https://alexandre-vasseur.com$request_uri;
    }

    # Sonde du cluster : liveness et readiness sur /.
    # HTML, CSS et JS du site : revalidés à chaque visite (ETag), donc une mise en ligne est
    # visible tout de suite sans renommer les fichiers.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Images, polices et bibliothèque three.js : cache long. Changer un fichier =
    # changer son nom, ou accepter jusqu'à 30 jours de cache chez ceux qui l'ont déjà vu.
    location ~* (^/js/vendor/|\.(?:webp|jpe?g|png|gif|svg|ico|woff2?)$) {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }
}
