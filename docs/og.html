<!doctype html>
<!-- Source de img/og.png (1200×630). Rendu, depuis la racine du dépôt :
     docker run --rm -v "$PWD":/w -w /w mcr.microsoft.com/playwright:v1.64.0-noble \
       npx -y playwright@1.64.0 screenshot --viewport-size=1200,630 --wait-for-timeout=1500 \
       file:///w/docs/og.html img/og.png
     Le ruban est rendu par js/ribbon.js (three.js, WebGL logiciel dans l'image Playwright). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Instrument Sans';font-weight:400 700;src:url('../fonts/instrument-sans-latin-wght.woff2') format('woff2')}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#FFFFFF;color:#121417;font-family:'Instrument Sans',sans-serif}
.hero{position:absolute;left:-120px;top:30px;width:1440px;height:630px}
canvas{position:absolute;inset:0;width:100%;height:100%}
.brand{position:absolute;left:72px;top:56px;font-size:26px;font-weight:500;letter-spacing:-.01em}
.brand::after{content:'.';color:#D97706}
h1{position:absolute;left:72px;top:140px;margin:0;font-weight:500;font-size:84px;line-height:.98;letter-spacing:-.035em;max-width:13ch}
.sub{position:absolute;left:72px;top:440px;font-size:24px;color:#5A606B;max-width:34ch}
</style>
</head>
<body>
<div class="hero" id="hero"><canvas id="ribbon"></canvas></div>
<span class="brand">Alexandre Vasseur</span>
<h1>Je construis des outils qui règlent de vrais problèmes.</h1>
<p class="sub">Ingénieur web senior à Lille. Alvatech, akwito.</p>
<script src="../js/vendor/three.min.js"></script>
<script src="../js/ribbon.js"></script>
</body>
</html>
